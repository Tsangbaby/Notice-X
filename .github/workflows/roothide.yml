{
  "name": "Notice-X RootHide verification",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "build": {
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_16.4.app/Contents/Developer",
        "THEOS_COMMIT": "3ac89c984ec652fd16bcd91b33ae16de45ce76fa",
        "THEOS_PACKAGE_SCHEME": "roothide",
        "FINALPACKAGE": "1"
      },
      "steps": [
        {
          "name": "Checkout frozen candidate",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Bind source and run before setup",
          "run": "set -euo pipefail\nmkdir -p ci-artifacts\nprintf 'THEOS=%s/theos\n' \"$RUNNER_TEMP\" >> \"$GITHUB_ENV\"\npython3 -B tools/ci_evidence.py scope --out ci-artifacts 2>&1 | tee ci-artifacts/provenance.log\n"
        },
        {
          "name": "Record selected Apple toolchain",
          "run": "set -euo pipefail\n{\n sw_vers\n uname -a\n xcodebuild -version\n test \"$(xcrun --sdk iphoneos --show-sdk-version)\" = 18.5\n xcrun swift --version\n xcrun clang --version\n xcrun --sdk iphoneos --show-sdk-path\n xcrun --sdk macosx --show-sdk-path\n} 2>&1 | tee ci-artifacts/toolchain.log\n"
        },
        {
          "name": "Install packaging prerequisites",
          "run": "set -euo pipefail\n{\n brew install make dpkg ldid\n printf '%s/libexec/gnubin\n' \"$(brew --prefix make)\" >> \"$GITHUB_PATH\"\n command -v gmake dpkg dpkg-deb ldid\n brew list --versions make dpkg ldid\n} 2>&1 | tee ci-artifacts/setup-tools.log\n"
        },
        {
          "name": "Install pinned RootHide Theos recursively",
          "run": "set -euo pipefail\n{\n git clone --no-checkout https://github.com/roothide/theos.git \"$THEOS\"\n git -C \"$THEOS\" checkout --detach \"$THEOS_COMMIT\"\n git -C \"$THEOS\" submodule update --init --recursive\n test \"$(git -C \"$THEOS\" rev-parse HEAD)\" = \"$THEOS_COMMIT\"\n git -C \"$THEOS\" rev-parse HEAD > ci-artifacts/THEOS_COMMIT.txt\n git -C \"$THEOS\" submodule status --recursive\n} 2>&1 | tee ci-artifacts/setup-theos.log\n"
        },
        {
          "name": "Stage hash-pinned Preferences link stub only",
          "run": "set -euo pipefail\n{\n mkdir -p \"$THEOS/lib/iphone/Preferences.framework\"\n target=\"$THEOS/lib/iphone/Preferences.framework/Preferences.tbd\"\n curl --fail --location --retry 2 https://raw.githubusercontent.com/theos/sdks/0222fd5413cf4b9af096f37b4621afa2688572f7/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd --output \"$target\"\n printf '%s  %s\n' 9daceaff6cf94346594a12f9ef9c2ea23de15475b516f9e33c20871a018c098b \"$target\" | shasum -a 256 --check\n cp \"$target\" ci-artifacts/Preferences.tbd\n} 2>&1 | tee ci-artifacts/setup-preferences.log\n"
        },
        {
          "name": "Run all Python source contracts",
          "run": "set -euo pipefail\npython3 -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee ci-artifacts/source-tests.log\n"
        },
        {
          "name": "Execute actual Swift core lifecycle and native host fixtures",
          "run": "set -euo pipefail\nexport SDKROOT=\"$(xcrun --sdk macosx --show-sdk-path)\"\npython3 -B tests/run_swift_tests.py --out ci-artifacts/swift-tests 2>&1 | tee ci-artifacts/swift-tests.log\n"
        },
        {
          "name": "Compile sign package both device architectures",
          "run": "set -euo pipefail\n{\n export PATH=\"$(brew --prefix make)/libexec/gnubin:$THEOS/bin:$PATH\"\n sdk=\"$(xcrun --sdk iphoneos --show-sdk-path)\"\n prefix=\"$(dirname \"$(xcrun --find clang)\")/\"\n make clean THEOS_PACKAGE_SCHEME=roothide SYSROOT=\"$sdk\" SDKVERSION=18.5 PREFIX=\"$prefix\"\n make -k -j2 package FINALPACKAGE=1 INSTALL=0 THEOS_PACKAGE_SCHEME=roothide SYSROOT=\"$sdk\" SDKVERSION=18.5 PREFIX=\"$prefix\" MESSAGES=1 COLOR=0\n} 2>&1 | tee ci-artifacts/theos-build.log\npython3 -B tools/ci_evidence.py retain --out ci-artifacts 2>&1 | tee ci-artifacts/retain-original.log\n"
        },
        {
          "name": "Independently verify retained original DEB",
          "run": "set -euo pipefail\npython3 -B tools/verify_package.py ci-artifacts/*.deb --report ci-artifacts/package-verification.json 2>&1 | tee ci-artifacts/package-verification.log\n"
        },
        {
          "name": "Bind all retained evidence checksums even after failure",
          "if": "always()",
          "run": "set -euo pipefail\nmkdir -p ci-artifacts\npython3 -B tools/ci_evidence.py manifest --out ci-artifacts --job-status '${{ job.status }}'\n"
        },
        {
          "name": "Upload original package and failure evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "noticex-roothide-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "ci-artifacts/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
